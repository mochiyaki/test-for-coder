<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bubble Sort Demo</title>
<style>
  body{
    font-family:system-ui,Arial,sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:1rem;
    padding:2rem;
    background:#111;
    color:#eee;
  }

  #controls button{
    padding:.6rem 1.2rem;
    font-size:1rem;
    cursor:pointer;
    border:none;
    border-radius:4px;
    background:#28a745;
    color:#fff;
    transition:background .2s;
  }
  #controls button:hover{background:#218838;}

  #array{
    display:flex;
    width:100%;
    max-width:800px;
    height:300px;
    align-items:flex-end;
    gap:.3rem;
  }
  .bar{
    flex:1 1 0;
    background:#0d6efd;
    transition:background .2s, transform .2s;
    font-size:.7rem;
    color:#fff;
    text-align:center;
  }
  .bar[data-status="compare"]{background:#ffc107;}
  .bar[data-status="swap"]{background:#dc3545;}
</style>
</head>
<body>

<h1>Bubble Sort Animation</h1>

<div id="controls">
  <button id="newArray">New Random Array</button>
  <button id="sortBtn">Sort!</button>
</div>

<div id="array"></div>

<script>
const ARRAY_SIZE = 15;          // tweak to change number of bars
const MAX_VALUE = 100;          // max bar height / value
const DELAY = 200;              // ms between steps

let arr = [];
const container = document.getElementById('array');
const newBtn = document.getElementById('newArray');
const sortBtn = document.getElementById('sortBtn');

function createRandomArray(){
  arr = Array.from({length:ARRAY_SIZE},
    () => Math.floor(Math.random()*MAX_VALUE)+5);
  renderArray();
}

function renderArray(highlight={i1:-1,i2:-1,swapped:false}){
  container.innerHTML='';
  arr.forEach((val,idx)=>{
    const bar=document.createElement('div');
    bar.className='bar';
    bar.dataset.value=val;
    bar.style.height=`${val*3}px`;
    bar.textContent=val;
    if(idx===highlight.i1 || idx===highlight.i2){
      bar.dataset.status=highlight.swapped?'swap':'compare';
    }
    container.appendChild(bar);
  });
}

async function bubbleSort(){
  sortBtn.disabled=true;
  for(let i=0;i<arr.length-1;i++){
    let swapped=false;
    for(let j=0;j<arr.length-i-1;j++){
      renderArray({i1:j,i2:j+1,swapped:false});
      await sleep(DELAY);
      if(arr[j]>arr[j+1]){
        renderArray({i1:j,i2:j+1,swapped:true});
        await sleep(DELAY);
        [arr[j],arr[j+1]]=[arr[j+1],arr[j]];
        swapped=true;
        renderArray({i1:j,i2:j+1,swapped:false});
        await sleep(DELAY);
      }
    }
    if(!swapped) break;
  }
  renderArray();
  sortBtn.disabled=false;
}

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

newBtn.onclick=createRandomArray;
sortBtn.onclick=bubbleSort;

createRandomArray();
</script>
</body>
</html>
